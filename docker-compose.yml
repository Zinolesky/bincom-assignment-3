services:
  db:
    image: postgres:16-alpine
    container_name: bincom_assignment3_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bincom_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bincom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bincom_assignment3_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: bincom_db

volumes:
  pgdata:
